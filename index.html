<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brokerly AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>🚀 Brokerly AI</h1>
    <p>Generate ad content, AI images, and voiceovers in seconds.</p>
  </header>

  <section class="tool">
    <h2>💬 Caption Generator</h2>
    <textarea id="text-input" placeholder="Enter your offer, hook, or idea..."></textarea>
    <button onclick="generateText()">Generate</button>
    <div id="text-output" class="output"></div>
  </section>

  <section class="tool">
    <h2>🖼 Image Prompt</h2>
    <input id="image-prompt" placeholder="Describe the image you want..." />
    <button onclick="generateImage()">Generate Image</button>
    <div id="image-output" class="output"><em>(image will render here)</em></div>
  </section>

  <section class="tool">
    <h2>🎙 Voiceover Line</h2>
    <textarea id="voice-input" placeholder="Enter voiceover script..."></textarea>
    <button onclick="generateVoice()">Generate Voice</button>
    <div id="voice-output" class="output"><em>(audio will play here)</em></div>
  </section>

  <footer>
    <p>© 2025 Brokerly AI — Built for brokers by builders.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
