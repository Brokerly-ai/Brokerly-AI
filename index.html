<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brokerly AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">Brokerly AI</div>
    <button class="cta">Generate Free Ad</button>
  </nav>

  <header class="hero">
    <h1>Generate High-Converting Ad Content in Seconds</h1>
    <p>Captions. Scripts. Images. Voiceovers. All AI. All yours.</p>
    <button class="cta">Start Creating</button>
  </header>

  <section class="tools">
    <div class="tool">
      <h2>🧠 Caption Generator</h2>
      <textarea id="caption-input" placeholder="Type your product or hook..."></textarea>
      <button onclick="generateCaption()">Generate Caption</button>
      <div id="caption-output" class="output"></div>
    </div>

    <div class="tool">
      <h2>🖼 Image Prompt Preview</h2>
      <input id="image-input" placeholder="Describe the image you want..." />
      <button onclick="generateImage()">Preview Image</button>
      <div id="image-output" class="output"></div>
    </div>

    <div class="tool">
      <h2>🎙 Voiceover Preview</h2>
      <textarea id="voice-input" placeholder="Paste your script here..."></textarea>
      <button onclick="generateVoice()">Play Voiceover</button>
      <div id="voice-output" class="output"></div>
    </div>
  </section>

  <footer>
    <p>© 2025 Brokerly AI. Built for brokers by builders.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
